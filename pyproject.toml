[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "methanation-ml"
version = "1.0.0"
description = "CatBoost + Leave-One-Group-Out workflow to screen CO2 methanation catalysts (ISRU context)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0", "pandas>=2.0", "scikit-learn>=1.4", "catboost>=1.2",
  "scipy>=1.10", "matplotlib>=3.7", "openpyxl>=3.1", "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
